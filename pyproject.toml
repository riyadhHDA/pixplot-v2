[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixplot"
version = "0.13.2"
description = "PixPlot v2 — visual exploration of large art corpora for art history"
authors = [{ name = "Riyadh HADJBA" }]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "tqdm",
]

[project.optional-dependencies]
# torch/torchvision s'installent à part (roues ROCm d'AMD), voir README.
ml = ["transformers>=4.56", "huggingface_hub", "faiss-cpu>=1.16", "umap-learn", "scikit-learn>=1.3", "pandas", "pyarrow", "tqdm", "leidenalg>=0.10", "igraph>=0.11", "sentencepiece", "protobuf"]
api = ["fastapi", "uvicorn"]
mcp = ["mcp>=2.3"]
dev = ["pytest", "httpx", "fastapi", "uvicorn", "mcp>=2.3"]

[project.scripts]
pixplot = "pixplot.cli:main"

[tool.setuptools.packages.find]
include = ["pixplot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
