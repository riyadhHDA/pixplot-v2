<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixPlot v2 — Atlas</title>
  <link rel="stylesheet" href="atlas.css">
</head>
<body>
  <header class="top">
    <div class="brand">PixPlot <span>v2</span></div>
    <form class="search" id="search-form" autocomplete="off">
      <select id="search-mode" aria-label="Type de recherche">
        <option value="meta">Métadonnées</option>
        <option value="text" disabled>Description (IA)</option>
      </select>
      <input id="search" type="search" placeholder="Rechercher : artiste, style, n° d'œuvre…" aria-label="Rechercher">
      <button type="button" id="search-clear" class="ghost" hidden>Effacer</button>
    </form>
    <label class="colorby" id="layout-wrap" hidden>Disposition
      <select id="layout">
        <option value="map">Carte des ressemblances</option>
      </select>
    </label>
    <label class="colorby">Affichage
      <select id="display">
        <option value="sprites">Vignettes</option>
        <option value="points">Points colorés</option>
      </select>
    </label>
    <label class="colorby">Couleur
      <select id="colorby"></select>
    </label>
    <div class="tools">
      <button class="ghost" id="open-compare" hidden title="Comparer les œuvres mises de côté">Comparer <b id="compare-count">0</b></button>
      <button class="ghost" id="open-suspects" hidden title="Étiquettes que toutes les voisines contredisent">À vérifier</button>
      <button class="ghost" id="open-notebook" title="Vos pistes, sélections et notes">Carnet</button>
    </div>
    <div class="stats" id="stats">Chargement…</div>
  </header>

  <main class="layout">
    <aside class="groups" id="groups-panel">
      <div class="panel-head">
        <h2>Groupes</h2>
        <button class="ghost" id="reset-view" title="Revenir à la vue d'ensemble">Vue d'ensemble</button>
      </div>
      <ol id="groups" class="group-list"></ol>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint">Molette : zoomer · glisser : se déplacer · clic sur une œuvre : sa fiche</div>
    </section>

    <aside class="fiche" id="fiche" hidden>
      <button class="close" id="fiche-close" aria-label="Fermer le panneau">×</button>
      <div id="fiche-body"></div>
    </aside>
  </main>

  <div class="compare" id="compare" hidden>
    <div class="compare-head">
      <h2>Comparaison</h2>
      <div class="compare-actions">
        <button class="ghost" id="compare-note">Ajouter au carnet</button>
        <button class="ghost" id="compare-export">Exporter en Research Pack</button>
        <button class="ghost" id="compare-clear">Vider</button>
        <button class="close" id="compare-close" aria-label="Fermer la comparaison">×</button>
      </div>
    </div>
    <div id="compare-body"></div>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="vendor/deck.gl-9.4.1.min.js"></script>
  <script src="atlas.js"></script>
</body>
</html>
